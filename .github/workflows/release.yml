name: Release

# A pushed v* tag releases that commit. A manual run releases any commit, e.g. an older version.
# Re-running for an existing release refreshes its title and notes and keeps the uploaded package.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to release
        required: true
        default: main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Release notes always come from the default branch's changelog, which lists every version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: current
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: build
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Test and pack
        working-directory: build
        run: |
          npm ci
          npm test
          npm pack
      - name: Write release notes
        id: meta
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('build/package.json', 'utf8'));
          const version = pkg.version;
          const dsh = pkg.engines?.dsh ?? pkg.peerDependencies?.['@deepseek-ai/dsh'];
          const changelog = readFileSync('current/CHANGELOG.md', 'utf8');
          const start = changelog.indexOf(`\n## ${version}`);
          if (start < 0) throw new Error(`CHANGELOG.md on the default branch has no section for ${version}`);
          const next = changelog.indexOf('\n## ', start + 1);
          const section = changelog.slice(start + 1, next < 0 ? undefined : next).split('\n').slice(1).join('\n').trim();
          const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/blob/${process.env.DEFAULT_BRANCH}/`;
          const body = [
            `在 DSH「插件 → 添加插件」中粘贴安装包链接 \`https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${version}/dsh-persona-${version}.tgz\`，或下载下方的 \`dsh-persona-${version}.tgz\` 后输入文件的绝对路径。安装后重启 DSH。`,
            `**适配 DSH \`${dsh}\`。** 其他 DSH 版本见 [README 的版本对应表](${base}README.md#安装)。`,
            section.replace(/\]\((?!https?:|#)([^)]+)\)/g, `](${base}$1)`),
          ].join('\n\n');
          writeFileSync('notes.md', `${body}\n`);
          // The title names the DSH release line, e.g. ">=0.1.7-rc.2 <0.1.8-0" -> "DSH 0.1.7".
          const line = /\d+\.\d+\.\d+/.exec(dsh ?? '')?.[0];
          const title = line ? `${version} · DSH ${line}` : version;
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntitle=${title}\nprerelease=${version.includes('-')}\n`);
          EOF
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - name: Publish
        working-directory: build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          TITLE: ${{ steps.meta.outputs.title }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release edit "v$VERSION" --title "$TITLE" --notes-file ../notes.md
            exit 0
          fi
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
          gh release create "v$VERSION" "dsh-persona-$VERSION.tgz" \
            --target "$(git rev-parse HEAD)" --title "$TITLE" --notes-file ../notes.md "${flags[@]}"
